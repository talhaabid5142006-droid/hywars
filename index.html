<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deploy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
        }

        .btn {
            width: 100%;
            max-width: 400px;
            padding: 24px 32px;
            background: #ffffff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            transition: all 0.15s ease;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.05);
            letter-spacing: -0.2px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn .icon {
            font-size: 22px;
        }

        .btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn.loading .spinner {
            display: block;
        }

        .btn.loading .icon,
        .btn.loading .text {
            opacity: 0.4;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <button class="btn" id="deployBtn">
        <span class="icon">🚀</span>
        <span class="text">Start</span>
        <span class="spinner"></span>
    </button>

            const btn = document.getElementById('deployBtn');
