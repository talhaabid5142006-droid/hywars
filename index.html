<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hywars | Vanilla Survival</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16211a; --grass:#5fa23a; --grass-dk:#437a28; --dirt:#6b4a32; --dirt-dk:#4a3322;
  --stone:#c9cdc6; --text:#eef2e8; --muted:#9fb09a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--night);color:var(--text);
  font-family:'Nunito',system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;
}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px 32px}
h1{
  font-family:'Silkscreen',monospace;font-weight:700;
  font-size:clamp(3rem,13vw,7.5rem);letter-spacing:.02em;line-height:1;
  color:var(--stone);
  text-shadow:0 6px 0 #3d4a40,0 12px 0 #2a352d;
}
.sub{margin-top:28px;font-size:1.15rem;color:var(--muted);max-width:30ch}
.copy{
  margin-top:40px;cursor:pointer;border:0;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 40px 16px;background:var(--grass);color:#fff;
  border-bottom:6px solid var(--grass-dk);border-right:6px solid var(--grass-dk);
  box-shadow:0 0 0 3px #0d140f;
  transition:transform .08s,border-width .08s;
}
.copy .ip{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(1.3rem,5vw,2rem)}
.copy .hint{font-size:.9rem;font-weight:700;opacity:.9}
.copy:hover{background:#6cb544}
.copy:active{transform:translate(4px,4px);border-bottom-width:2px;border-right-width:2px}
.copy:focus-visible{outline:3px solid #fff;outline-offset:4px}
.copy.done{background:#e0b83a;border-color:#a98a1f;color:#2b2208}
.rules{
  list-style:none;padding:0;margin-top:56px;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-width:760px;width:100%;text-align:left;
}
.rules li{background:var(--dirt);border-bottom:5px solid var(--dirt-dk);padding:16px 18px;font-weight:700}
.rules span{display:block;font-weight:500;color:#e6d3c1;font-size:.95rem;margin-top:4px}
.strip{height:28px;background:var(--grass);border-bottom:14px solid var(--dirt)}
footer{background:var(--dirt-dk);color:#d9c3ad;text-align:center;padding:14px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.copy{transition:none}}
</style>
</head>
<body>
<main>
  <h1>HYWARS</h1>
  <p class="sub">A vanilla survival server. Java Edition.</p>

  <button class="copy" id="copy" type="button" aria-live="polite">
    <span class="ip" id="ip">play.hywars.net</span>
    <span class="hint" id="hint">Click to copy the IP</span>
  </button>

  <ul class="rules">
    <li>Pure vanilla<span>No mods, no custom items.</span></li>
    <li>Survive your way<span>Build, farm, explore, trade.</span></li>
    <li>Fair play<span>Be kind and no cheating.</span></li>
  </ul>
</main>
<div class="strip"></div>
<footer>Hywars &copy; 2026. Not affiliated with Mojang or Microsoft.</footer>

<script>
(function(){
  var btn=document.getElementById('copy'),ip=document.getElementById('ip').textContent,hint=document.getElementById('hint'),t;
  function done(ok){
    btn.classList.toggle('done',ok);
    hint.textContent=ok?'Copied! Paste it in Minecraft':'Press Ctrl+C to copy';
    clearTimeout(t);
    t=setTimeout(function(){btn.classList.remove('done');hint.textContent='Click to copy the IP'},2200);
  }
  function fallback(){
    var a=document.createElement('textarea');a.value=ip;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(a);done(ok);
  }
  btn.addEventListener('click',function(){
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(ip).then(function(){done(true)},fallback);
    }else{fallback()}
  });
})();
</script>
</body>
</html>
